[project]
name = "geo-ips"
version = "2.0.0"
description = "GeoIPS — Plane Geometry Intelligent Problem Solver (Neuro-Symbolic & GraphRAG, AlphaGeometry-inspired)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "neo4j>=5.14.0",
    "qdrant-client>=1.7.0",
    "torch>=2.2.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "typing-extensions>=4.7.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.2.2",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "langchain-google-genai>=4.2.3",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

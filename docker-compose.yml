# GeoIPS — Docker Compose
# Qdrant is now managed externally (Qdrant Cloud or local host).
# Set QDRANT_MODE=cloud in .env to use Qdrant Cloud (recommended),
# or QDRANT_MODE=local to run against a local Qdrant instance on the host.

services:
  neo4j:
    image: neo4j:5.12.0
    container_name: geo_ips_neo4j
    stop_grace_period: 15s
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/omni_ips_password
    tmpfs:
      - /var/lib/neo4j/run
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo_ips_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=omni_ips_password
    depends_on:
      - neo4j
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: geo_ips_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    volumes:
      - .:/app

volumes:
  neo4j_data:
  neo4j_logs:
